plugins {
    id "com.android.library"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.serialization"
}

group 'com.kcniverba'
version '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Kotlin 2.3 removed the `kotlinOptions` DSL in favour of `compilerOptions`.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.kcniverba'
    }

    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += [
            'src/main/kotlin',
            // Vendored pipecat-client-android fork with llm-function-call lifecycle callbacks.
            // Compiled directly into the plugin to avoid Gradle sub-project complexity in
            // Flutter's build system. ai.pipecat:client is excluded below so the published
            // AAR doesn't conflict with this source.
            'vendored/pipecat-client-android/pipecat-client-android/src/main/java',
        ]
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        // Exclude ai.pipecat:client AAR — we compile the vendored source directly above.
        implementation("ai.pipecat:daily-transport:1.2.1") {
            exclude group: "ai.pipecat", module: "client"
        }
        // Matches what daily-transport 1.2.1 already resolves. Pinned explicitly so the
        // Daily version is visible here rather than buried in a transitive graph.
        implementation "co.daily:client:0.39.1"
        implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0"
        implementation "com.squareup.okhttp3:okhttp:4.12.0"

        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
